<!doctype html>
<!-- หน้า HTML หลักของแอป (Single Page Application) — React จะสร้างหน้าจอทั้งหมดลงใน <div id="root"> -->
<!-- lang="th" = ภาษาเริ่มต้นของระบบคือภาษาไทย (สลับภาษาได้ในขั้น 0.4) -->
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- ไอคอนบนแท็บเบราว์เซอร์: ตรากลีบเลี้ยงมังคุด -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- ให้หน้าจอปรับขนาดตามอุปกรณ์ (รองรับมือถือ) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ฟอนต์จาก Google Fonts (น้ำหนักเดียวกับ wireframe):
         Taviraj = หัวข้อ/ตัวเลขเด่น, IBM Plex Sans Thai = เนื้อความ ; display=swap = แสดงข้อความทันทีระหว่างโหลดฟอนต์ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Taviraj:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap"
    />
    <title>Mangosteen Campus</title>
  </head>
  <body>
    <!-- จุดที่ React วาดหน้าจอลงไป -->
    <div id="root"></div>
    <!-- โหลดโค้ดเริ่มต้นของแอป -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
